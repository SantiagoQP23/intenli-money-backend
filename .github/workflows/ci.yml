name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intenli
          POSTGRES_PASSWORD: intenli
          POSTGRES_DB: intenli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intenli"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://intenli:intenli@localhost:5432/intenli_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/api
